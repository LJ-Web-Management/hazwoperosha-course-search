<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Catalog Search - Hazwoper Osha Training</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="accent-bar"></div>
  <header class="site-header">
    <div class="brand">
      <img src="assets/hazwoper-logo.png" alt="Hazwoper Osha Training LLC" />
      <div class="brand-title">Course Catalog Search</div>
    </div>
  </header>

  <main>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-panel panel">
          <div class="panel-accent"></div>
          <div class="sidebar-panel-body">
            <div class="sidebar-title">Category</div>
            <select id="category-select" class="sidebar-select" aria-label="Filter by category"></select>
            <div class="sidebar-title sidebar-title-spaced">Industry</div>
            <select id="industry-select" class="sidebar-select"></select>
          </div>
        </div>
      </aside>

      <div class="main-content">
        <section class="panel">
          <div class="panel-accent"></div>
          <div class="search-panel-body">
            <div class="mode-toggle" role="group" aria-label="Search mode">
              <button type="button" id="mode-courses-btn" class="mode-btn" aria-pressed="true">Courses</button>
              <button type="button" id="mode-bundles-btn" class="mode-btn" aria-pressed="false">Bundles</button>
            </div>
            <div class="search-row">
              <div class="search-input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="search" id="search-input" placeholder="Search by course name…" autocomplete="off" />
              </div>
              <div class="search-input-wrap" id="tag-field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="search" id="tag-search-input" placeholder="Search by tag…" autocomplete="off" />
              </div>
            </div>
          </div>
          <div class="toolbar">
            <span class="result-count" id="result-count"></span>
            <div class="toolbar-actions">
              <div class="field sort-field">
                <select id="sort-select" aria-label="Sort by"></select>
              </div>
              <div class="view-toggle" role="group" aria-label="View mode">
                <button type="button" id="view-list-btn" class="view-btn" aria-pressed="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                  List
                </button>
                <button type="button" id="view-grid-btn" class="view-btn" aria-pressed="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
                  Grid
                </button>
              </div>
              <button class="clear-btn" id="clear-btn" type="button">Clear filters</button>
            </div>
          </div>
        </section>

        <div class="results-wrap" id="results-wrap">
          <table class="results-table">
            <thead id="table-head"></thead>
            <tbody id="results-body"></tbody>
          </table>
          <div class="results-grid" id="results-grid" hidden></div>
        </div>

        <div class="empty-state" id="empty-state" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <div>No results match your search. Try adjusting the filters.</div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© Hazwoper Osha Training LLC, 2026</span>
      <span>Internal Use Only · Course Catalog Search</span>
    </div>
    <div class="accent-bar"></div>
  </footer>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
